<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Custom Toast Test</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            background: #f5f5f5;
        }
        .test-buttons {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }
        .test-btn {
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            color: white;
            transition: opacity 0.2s;
        }
        .test-btn:hover {
            opacity: 0.8;
        }
        .success { background: #10B981; }
        .error { background: #EF4444; }
        .warning { background: #F59E0B; }
        .info { background: #3B82F6; }
        .question { background: #8B5CF6; }
        .custom { background: #6B7280; }
        .rtl-toggle {
            background: #059669;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin-bottom: 20px;
        }
        .status {
            background: white;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            border-left: 4px solid #3B82F6;
        }
    </style>
</head>
<body>
    <h1>Custom Toast Notification System Test</h1>
    
    <div class="status">
        <strong>Status:</strong> Testing custom toast system...
    </div>
    
    <button class="rtl-toggle" onclick="toggleRTL()">Toggle RTL Mode</button>
    
    <div class="test-buttons">
        <button class="test-btn success" onclick="testSuccess()">Success Toast</button>
        <button class="test-btn error" onclick="testError()">Error Toast</button>
        <button class="test-btn warning" onclick="testWarning()">Warning Toast</button>
        <button class="test-btn info" onclick="testInfo()">Info Toast</button>
        <button class="test-btn question" onclick="testQuestion()">Question Toast</button>
        <button class="test-btn custom" onclick="testCustom()">Custom Toast</button>
        <button class="test-btn custom" onclick="testFire()">Fire Toast</button>
        <button class="test-btn custom" onclick="testShow()">Show Toast</button>
    </div>
    
    <div class="status">
        <strong>Console:</strong> Check browser console for logs
    </div>
    
    <script>
        // Wait for the page to load
        window.addEventListener('load', function() {
            console.log('Page loaded, checking for custom toast...');
            
            // Check if custom toast is available
            if (window.toast) {
                console.log('✅ Custom toast is available!');
                console.log('Toast methods:', Object.keys(window.toast));
                updateStatus('✅ Custom toast system is working!', 'success');
            } else {
                console.log('❌ Custom toast is NOT available');
                updateStatus('❌ Custom toast system is NOT working!', 'error');
            }
        });
        
        function updateStatus(message, type) {
            const statusEl = document.querySelector('.status');
            statusEl.innerHTML = `<strong>Status:</strong> ${message}`;
            statusEl.style.borderLeftColor = type === 'success' ? '#10B981' : '#EF4444';
        }
        
        function testSuccess() {
            if (window.toast) {
                window.toast.success('Success!', 'This is a success message from custom toast system');
            }
        }
        
        function testError() {
            if (window.toast) {
                window.toast.error('Error!', 'This is an error message from custom toast system');
            }
        }
        
        function testWarning() {
            if (window.toast) {
                window.toast.warning('Warning!', 'This is a warning message from custom toast system');
            }
        }
        
        function testInfo() {
            if (window.toast) {
                window.toast.info('Info!', 'This is an info message from custom toast system');
            }
        }
        
        function testQuestion() {
            if (window.toast) {
                window.toast.question('Question!', 'This is a question message from custom toast system');
            }
        }
        
        function testCustom() {
            if (window.toast) {
                window.toast.custom({
                    type: 'custom',
                    title: 'Custom!',
                    message: 'This is a custom toast with custom styling',
                    duration: 8000
                });
            }
        }
        
        function testFire() {
            if (window.toast) {
                window.toast.fire({
                    icon: 'success',
                    title: 'Fire Success!',
                    message: 'This toast was created using the fire method'
                });
            }
        }
        
        function testShow() {
            if (window.toast) {
                window.toast.show('Simple message using show method');
            }
        }
        
        function toggleRTL() {
            const html = document.documentElement;
            const currentDir = html.getAttribute('dir');
            const newDir = currentDir === 'rtl' ? 'ltr' : 'rtl';
            
            html.setAttribute('dir', newDir);
            document.body.classList.remove('rtl', 'ltr');
            document.body.classList.add(newDir);
            
            // Dispatch RTL change event
            window.dispatchEvent(new CustomEvent('rtl-changed', {
                detail: { isRTL: newDir === 'rtl' }
            }));
            
            console.log('RTL toggled to:', newDir);
            
            // Test toast after RTL change
            if (window.toast) {
                window.toast.info('RTL Changed!', `RTL mode is now: ${newDir.toUpperCase()}`);
            }
        }
    </script>
</body>
</html>
